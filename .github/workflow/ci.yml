name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate mock data
        run: python scripts/generate_mock_data.py
      - name: Load data
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASS: postgres
        run: python scripts/load_data.py
      - name: Run dbt (if using dbt in repo)
        run: |
          pip install dbt-postgres
          cd dbt_project
          dbt deps || true
          dbt run
          dbt test
